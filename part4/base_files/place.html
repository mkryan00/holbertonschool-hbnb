<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="HBnB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <section id="place-details" class="place-details">
            <div class="place-info">
                <h1>Sample Place</h1>
                <p><strong>Host:</strong> John Doe</p>
                <p><strong>Price per night:</strong> $100</p>
                <p><strong>Description:</strong> A lovely place to stay.</p>
                <p><strong>Amenities:</strong> Wi-Fi, Air Conditioning</p>
            </div>
        </section>

        <section id="reviews">
            <h2>Reviews</h2>
            <div class="review-card">
                <p><strong>John:</strong> Great place to stay!</p>
                <p>Rating: 5/5</p>
            </div>
        </section>

        <section id="add-review" class="add-review">
            <h2>Add a Review</h2>
            <form id="review-form" class="form">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
